version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmdware-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmdware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmdware_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-gmdware_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
