<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="icon-electric-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="48" height="48" rx="12" fill="#070B14" />
  <rect width="46" height="46" x="1" y="1" rx="11" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- [G] Letter: Crisp White -->
  <path
    d="M 14 14 H 9 C 6.8 14 5 15.8 5 18 V 30 C 5 32.2 6.8 34 9 34 H 14 C 16.2 34 18 32.2 18 30 V 25 H 11"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- [M] Left Pillar: Crisp White -->
  <path
    d="M 21 34 V 14"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- [M] Left Diagonal: Crisp White -->
  <path
    d="M 21 14 L 25.5 24"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- [M] Signature Electric Blue Dynamic Accent -->
  <path
    d="M 25.5 24 L 30 14"
    stroke="url(#icon-electric-blue)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#icon-glow)"
  />

  <!-- [M] Right Pillar: Crisp White -->
  <path
    d="M 30 14 V 34"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- [D] Letter: Crisp White -->
  <path
    d="M 34 14 V 34 M 34 14 H 38 C 42 14 44 17.5 44 24 C 44 30.5 42 34 38 34 H 34"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Coordinate Reticle Center Dot -->
  <circle cx="25.5" cy="24" r="1.5" fill="#00D2FF" />
</svg>
